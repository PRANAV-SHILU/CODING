<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Qualification Form</title>
</head>
<body>
    <form action="insert.php" method="post" enctype="multipart/form-data">
        <h1>Personal Details</h1>

        <label>Name</label>
        <input type="text" name="name">
        <br>

        <label>Password</label>
        <input type="password" name="password">
        <br>

        <label>Email</label>
        <input type="email" name="email">
        <br>

        <label>Gender</label>
        <input type="radio" name="gender" value="m"> Male
        <input type="radio" name="gender" value="f"> Female
        <br>

        <label>Contact</label>
        <input type="number" name="contact">
        <br>

        <h1>Educational Details</h1>

        <label>Degree</label>
        <select name="degree">
            <option>BCA</option>
            <option>BSCIT</option>
            <option>BHMS</option>
            <option>MBBS</option>
        </select>
        <br>

        <label>Group</label>
        <select name="e_group">
            <option>A</option>
            <option>B</option>
        </select>
        <br>

        <label>Hobbie</label>
        <input type="checkbox" name="hobbie[]" value="playing_chess"> Playing Chess
        <input type="checkbox" name="hobbie[]" value="reading_books"> Reading Books
        <br>

        <label>Address</label>
        <input type="text" name="address">
        <br>

        <label>Resume</label>
        <input type="file" name="resume">
        <br>

        <input type="submit">
    </form>
</body>
</html>
